name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # Full suite is ~1,900 tests (~12-15 min) plus dependency install and the
    # runtime evidence gate (~20-30 min; equity_stat_arb alone ~10-20 min).
    # 10 min was never sufficient — CI previously died on collection errors
    # before reaching the suite, so this was never seen.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev,stats,viz,data]"

      - name: Lint (ruff)
        run: ruff check quantcore/ tests/ --exit-zero
        # --exit-zero: report warnings but never fail the build on lint alone.
        # Warnings are informational; errors (E/F rules) trigger annotation.

      - name: Unit tests
        run: >
          pytest tests/
          -m "not integration"
          --tb=short
          -q
          --timeout=600
          --junitxml=junit.xml
          --cov=quantcore
          --cov-report=xml
          --cov-report=term-missing

      - name: Runtime evidence gate
        run: python scripts/validate_all_strategies.py --quick --enforce-runtime-gate

      - name: Test summary
        if: always()
        run: |
          echo "=== CI SUMMARY ==="
          if [ -f junit.xml ]; then
            python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('junit.xml')
          root = tree.getroot()
          total = int(root.attrib.get('tests', 0))
          failures = int(root.attrib.get('failures', 0))
          errors = int(root.attrib.get('errors', 0))
          skipped = int(root.attrib.get('skipped', 0))
          passed = total - failures - errors - skipped
          print(f'Tests: {total} total | {passed} passed | {failures} failed | {errors} errors | {skipped} skipped')
          print(f'Time:  {float(root.attrib.get(\"time\", 0)):.1f}s')
          "
          else
            echo "No test results file found."
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
