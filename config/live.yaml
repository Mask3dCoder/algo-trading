# SINGLE-STRATEGY DEPLOYMENT — Audit Mandate 2026-07-12
# =============================================================================
# Purge rationale (see reports/strategy_scoreboard.md + experiments.csv):
#   * KEEP=0 across the 27 equity/macro strategies that WERE tournament-graded.
#   * Options strategies were EXCLUDED from that scoreboard ("require options
#     chain data"), so their prior config Sharpes (2.48 etc.) are NOT validated —
#     they came from a synthetic backtest carrying the hedge-P&L inflation bug.
#   * options_delta_neutral is retained ONLY as the single salvage candidate and
#     is LOCKED to single_share until scripts/institutional_gate.py returns PASS
#     on REAL options data (2021-06..2024-12) AND 30 reconciled paper days pass.
#
# SECURITY: All API keys via environment variables (never hardcoded).
#   Required env vars: ALPACA_API_KEY, ALPACA_API_SECRET, TELEGRAM_BOT_TOKEN,
#   TELEGRAM_CHAT_ID  (loaded by scripts/_run_live.py via python-dotenv).

enabled: true

broker:
  type: paper
  alpaca:
    api_key: ''          # loaded from ALPACA_API_KEY
    secret_key: ''       # loaded from ALPACA_API_SECRET
    base_url: https://paper-api.alpaca.markets
  ibkr:
    host: 127.0.0.1
    port: 7497
    client_id: 1
    account_id: ''
    timeout: 30
    readonly: false

# ── Strategies ───────────────────────────────────────────────────────────────
# ONLY options_delta_neutral. All others deleted per audit purge.
strategies:
  - name: options_delta_neutral
    enabled: true
    weight: 1.0
    scale_mode: single_share    # LOCKED until Phase 7 passes (gate + 30 recon days)
    instrument_type: OPTION     # Hard override to prevent equity fallback
    strategy_type: OPTIONS
    data_source: yfinance_vix
    kill_switch_path: /tmp/KILL_SWITCH
    circuit_breaker:
      max_daily_loss_pct: 0.01
      max_drawdown_pct: 0.05
    params:
      structure: straddle
      ivr_entry: 50
      ivr_exit: 25
      dte_min: 30
      dte_max: 60
      delta_target: 0.3
      hedge_freq: 1
      gamma_scalp_threshold: 0.01
      max_positions: 5
      commission_per_contract: 0.65
      # Phase 6 dynamic vol-targeting inputs (applied when scale_mode=dynamic_vol)
      target_annual_vol: 0.12
      risk_per_trade_pct: 0.02

universe:
  tickers:
    - SPY
  macro_assets:
    - SPY

# ── Risk ───────────────────────────────────────────────────────────────────
risk:
  max_position_per_ticker_pct: 0.05
  max_gross_exposure_pct: 2.0
  max_daily_loss_pct: 0.03
  max_drawdown_pct: 0.12
  max_single_order_pct: 0.05
  max_leverage: 2.0
  circuit_breaker:
    daily_loss_pct: 0.03
    critical_drawdown_pct: 0.12
    consecutive_rejections: 10

execution:
  scale_mode: single_share       # LOCKED — flipped to dynamic_vol only by Phase 7
  initial_cash: 100000.0
  slippage_bps: 5
  commission_per_share: 0.005

schedule:
  trading_time: '16:15'
  reconciliation_time: '16:30'
  timezone: US/Eastern

monitoring:
  health_check_interval_sec: 60
  log_file: reports/live_events.jsonl
  equity_file: reports/live_equity.csv

alerting:
  enabled: true
  file_path: reports/alerts.log
  telegram:
    enabled: true
    bot_token: ''
    chat_id: ''
  slack:
    enabled: false
    webhook_url: ''
  email:
    enabled: false

kill_switch:
  file_path: /tmp/KILL_SWITCH
  check_interval_sec: 10

api:
  host: 0.0.0.0
  port: 8000
  enabled: true
