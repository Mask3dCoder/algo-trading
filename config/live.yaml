# QuantCore Production Configuration
# -----------------------------------
# All thresholds use sensible defaults. Override via environment variables
# with the QUANTCORE_ prefix (e.g. QUANTCORE_BROKER__API_KEY).

# ── Broker ──────────────────────────────────────────────────────────────
broker:
  type: paper                    # paper | alpaca | ibkr
  alpaca:
    api_key: ""                  # or set QUANTCORE_BROKER__ALPACA__API_KEY
    secret_key: ""
    base_url: "https://paper-api.alpaca.markets"
  ibkr:
    host: "127.0.0.1"
    port: 7497
    client_id: 1
    account_id: ""
    timeout: 30
    readonly: false

# ── Strategies ──────────────────────────────────────────────────────────
# Each entry maps to a @register(name) strategy in quantcore.strategies.
# params are passed to StrategyConfig.params.
# Weight allocation: macro 0.35, equity 0.55, intraday 0.10
strategies:
  # -- Macro (daily) ───────────────────────────────────────────────────
  - name: macro_cross_sectional_momentum
    enabled: true
    weight: 0.12
    data_source: alpaca_daily
    params: {}

  - name: macro_state_selective_momentum
    enabled: true
    weight: 0.12
    data_source: alpaca_daily
    params: {}

  - name: macro_factor_residual_v3
    enabled: true
    weight: 0.11
    data_source: alpaca_daily
    params: {}

  # -- Equity (daily) ──────────────────────────────────────────────────
  - name: equity_mean_reversion
    enabled: true
    weight: 0.15
    data_source: alpaca_daily
    params: {}

  - name: equity_cross_sectional_momentum
    enabled: true
    weight: 0.10
    data_source: alpaca_daily
    params: {}

  - name: equity_trend_following
    enabled: true
    weight: 0.10
    data_source: alpaca_daily
    params: {}

  - name: equity_tsmom
    enabled: true
    weight: 0.10
    data_source: alpaca_daily
    params: {}

  # -- Equity (intraday) ───────────────────────────────────────────────
  - name: equity_stat_arb
    enabled: true
    weight: 0.10
    data_source: alpaca_intraday
    bar_size: 5min
    params:
      lookback: 120
      entry_z: 2.0
      exit_z: 0.5
      max_pairs: 5
      rescan_freq: 20

  - name: opening_gap_fade
    enabled: true
    weight: 0.10
    data_source: alpaca_intraday_gap_fade
    bar_size: 5min
    params:
      gap_threshold_pct: 2.0
      exit_minutes: 30
      retracement_target: 0.50
      max_positions: 10
      max_position_pct: 0.05
      min_adv_dollars: 10000000
      min_price: 10.0
      stop_loss_pct: 1.5

# ── Universe ────────────────────────────────────────────────────────────
# 6 macro assets + 50 S&P 500 stocks for gap-fade strategy
universe:
  tickers:
    # Macro assets (used by CSM, SSM, stat_arb)
    - SPY
    - QQQ
    - IWM
    - GLD
    - TLT
    - DBC
    # S&P 500 stocks (used by opening_gap_fade)
    - AAPL
    - MSFT
    - AMZN
    - NVDA
    - GOOGL
    - META
    - TSLA
    - BRK.B
    - UNH
    - JNJ
    - V
    - XOM
    - JPM
    - PG
    - MA
    - HD
    - CVX
    - MRK
    - LLY
    - ABBV
    - PFE
    - KO
    - AVGO
    - PEP
    - COST
    - TMO
    - MCD
    - WMT
    - CSCO
    - ACN
    - ABT
    - DHR
    - LIN
    - TXN
    - NEER
    - UPS
    - RTX
    - QCOM
    - PM
    - HON
    - LOW
    - AMGN
    - INTU
    - BA
    - GE
    - CAT
    - SBUX
    - ISRG
    - AMD
    - PLD
  macro_assets: ["SPY", "QQQ", "IWM", "GLD", "TLT", "DBC"]

# ── Risk ────────────────────────────────────────────────────────────────
risk:
  max_position_per_ticker_pct: 0.05
  max_gross_exposure_pct: 2.0
  max_daily_loss_pct: 0.02
  max_drawdown_pct: 0.10
  max_single_order_pct: 0.05
  max_leverage: 2.0

  circuit_breaker:
    daily_loss_pct: 0.02
    critical_drawdown_pct: 0.10
    consecutive_rejections: 5

# ── Execution ───────────────────────────────────────────────────────────
execution:
  scale_mode: fractional         # single_share | fractional | full
  initial_cash: 100000.0
  slippage_bps: 5
  commission_per_share: 0.005

# ── Schedule ────────────────────────────────────────────────────────────
schedule:
  trading_time: "16:15"          # ET — daily signal evaluation
  reconciliation_time: "16:30"   # ET — post-market reconciliation
  timezone: "US/Eastern"

# ── Monitoring & Alerting ───────────────────────────────────────────────
monitoring:
  health_check_interval_sec: 60
  log_file: "reports/live_events.jsonl"
  equity_file: "reports/live_equity.csv"

alerting:
  enabled: true
  file_path: "reports/alerts.log"
  slack:
    enabled: false
    webhook_url: ""              # or set QUANTCORE_ALERTING__SLACK__WEBHOOK_URL
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    from_addr: ""
    to_addrs: []
    username: ""
    password: ""                 # or set QUANTCORE_ALERTING__EMAIL__PASSWORD

# ── Kill Switch ─────────────────────────────────────────────────────────
kill_switch:
  file_path: "KILL_SWITCH"       # create this file to halt trading
  check_interval_sec: 10

# ── API Server ──────────────────────────────────────────────────────────
api:
  host: "0.0.0.0"
  port: 8000
  enabled: true
