# QuantCore Multi-Strategy Live Configuration
# Updated: 2026-05-29 — Institutional-grade multi-strategy paper trading
#
# SECURITY: All API keys via environment variables (never hardcoded).
#   Required env vars:
#     ALPACA_API_KEY, ALPACA_API_SECRET
#     TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#
# Multi-strategy: each strategy has independent weight, data source, and risk limits.

broker:
  type: paper
  alpaca:
    # Credentials loaded from environment: ALPACA_API_KEY, ALPACA_API_SECRET
    api_key: ''
    secret_key: ''
    base_url: https://paper-api.alpaca.markets
  ibkr:
    host: 127.0.0.1
    port: 7497
    client_id: 1
    account_id: ''
    timeout: 30
    readonly: false

# ── Strategies ─────────────────────────────────────────────────────────────
# Walk-forward validated 2026-05-29 (504-day train, 126-day test, 2018-2024)
# Risk-parity weights computed from trailing OOS realized volatility.
# Triage: KEEP (CI_low>0, DSR p<0.1), MONITOR (CI_low>0), DISABLE (CI_low<=0)
strategies:
  # ── KEEP: Delta Neutral VRP ─────────────────────────────────────────────
  # OOS Sharpe: 2.48, CI: [1.57, 3.43], MaxDD: 0.5%, DSR p: 0.044
  - name: options_delta_neutral
    enabled: true
    weight: 0.352    # risk-parity weight (1/vol normalized)
    data_source: yfinance_vix
    strategy_type: OPTIONS
    circuit_breaker:
      max_daily_loss_pct: 0.01
      max_drawdown_pct: 0.05
    params:
      ivr_entry: 50
      ivr_exit: 25
      dte_min: 30
      dte_max: 60
      delta_target: 0.3
      hedge_freq: 1
      gamma_scalp_threshold: 0.01
      max_positions: 5

  # ── MONITOR: Put Write VRP ──────────────────────────────────────────────
  # OOS Sharpe: 2.10, CI: [0.96, 4.18], MaxDD: 0.3%, DSR p: 0.399
  - name: options_put_write
    enabled: true
    weight: 0.580    # risk-parity weight (lowest vol → highest weight)
    data_source: yfinance_vix
    strategy_type: OPTIONS
    circuit_breaker:
      max_daily_loss_pct: 0.02
      max_drawdown_pct: 0.05
    params:
      vix_entry: 15
      otm_pct: 0.95
      dte: 30
      risk_per_trade: 0.02
      max_positions: 3

  # ── MONITOR: Iron Condor VRP ────────────────────────────────────────────
  # OOS Sharpe: 1.90, CI: [1.14, 2.58], MaxDD: 1.4%, DSR p: 0.617
  - name: options_iron_condor
    enabled: true
    weight: 0.068    # risk-parity weight (highest vol → lowest weight)
    data_source: yfinance_vix
    strategy_type: OPTIONS
    circuit_breaker:
      max_daily_loss_pct: 0.01
      max_drawdown_pct: 0.03
    params:
      delta_short: 0.3
      delta_long: 0.15
      dte_min: 30
      dte_max: 45
      ivr_entry: 40

  # ── DISABLED: Macro strategies (CI_lower <= 0) ──────────────────────────
  # macro_cross_sectional_momentum: Sharpe 0.65, CI [-0.12, 1.40] — DISABLE
  # macro_risk_parity: Sharpe 0.50, CI [-0.31, 1.15] — DISABLE
  # macro_vrp: Sharpe 0.00 (no signals) — DISABLE
  # tail_hedge: Sharpe -0.06 — DISABLE

