# QuantCore Phase 4 Paper Validation Configuration
# Updated: 2026-06-12
# Batch status: CLOSED 2026-07-21 (see below)
#
# BATCH CLOSED 2026-10-11 (registry reconciliation):
#   The validation window 2026-06-09 -> 2026-07-21 has elapsed and both
#   strategies are INACTIVE in strategy_status.yaml. This file is retained
#   as the record of that batch (composition, weights, params, circuit
#   breakers). It is NOT launchable: `python scripts/config_preflight.py
#   --paper` now fails closed on the elapsed window and on the phase
#   mismatch. A new paper batch requires a fresh window plus explicit
#   governance approval — it is not a config edit.
#   equity_stat_arb additionally failed honest full-engine validation on
#   2026-10-10 (OOS Sharpe -0.46, 90% CI lower -2.84).
#
# Purpose:
#   Parallel paper validation for non-live strategies selected from the
#   registered/walk-forward-tested candidate pool. This config is intentionally
#   separate from config/live.yaml and must not alter live allocations.
#
# Discipline:
#   - No threshold or parameter tuning during the paper-validation window.
#   - Paper trading is the out-of-sample validation period.
#   - Any strategy breaching its drawdown limit is halted for review, not tuned.
#   - H001 OPRA flow remains DATA_BLOCKED until a reliable OPRA source exists.

broker:
  type: paper
  alpaca:
    api_key: ''
    secret_key: ''
    base_url: https://paper-api.alpaca.markets

validation:
  start_date: 2026-06-09
  end_date: 2026-07-21
  duration_weeks: 6
  purpose: Phase 4 production risk-control validation
  tuning_allowed: false

execution:
  scale_mode: single_share
  initial_cash: 10000.0
  slippage_bps: 5
  commission_per_share: 0.005

# Allocation weights sum to 1.0 within the separate paper account.
# risk_budget_weight is the fraction of total production risk budget reserved
# for this paper strategy; it is documentation/gating metadata, not live weight.
strategies:
  - name: equity_stat_arb
    enabled: true
    paper: true
    allocation_weight: 0.500000
    risk_budget_weight: 0.015
    data_source: alpaca_daily
    strategy_type: EQUITY
    circuit_breaker:
      max_daily_loss_pct: 0.01
      max_drawdown_pct: 0.20
    params:
      lookback: 252
      half_life_max: 20
      entry_z: 2.0
      exit_z: 0.5
      kelly_fraction: 0.5
      max_pairs: 10
      rescan_freq: 63

  - name: options_tail_hedge
    enabled: true
    paper: true
    allocation_weight: 0.500000
    risk_budget_weight: 0.015
    data_source: yfinance_vix
    strategy_type: OPTIONS
    circuit_breaker:
      max_daily_loss_pct: 0.01
      max_drawdown_pct: 0.20
    params:
      otm_pct: 10
      dte_entry: 90
      dte_roll: 30
      notional_budget_pct: 1
      skew_entry_threshold: 1.5
      vol_entry_threshold: 25
      correlation_threshold: 0.7

