risk:
  max_position_per_ticker_pct: 0.02
  max_gross_exposure_pct: 0.50
  max_daily_loss_pct: 0.01
  max_drawdown_pct: 0.20
  max_single_order_pct: 0.02
  max_leverage: 0.50
  circuit_breaker:
    daily_loss_pct: 0.01
    critical_drawdown_pct: 0.20
    consecutive_rejections: 5

schedule:
  trading_time: '16:15'
  reconciliation_time: '16:30'
  timezone: US/Eastern

monitoring:
  health_check_interval_sec: 60
  log_file: reports/paper_events.jsonl
  equity_file: reports/paper_equity.csv

alerting:
  enabled: true
  file_path: reports/paper_alerts.log
  telegram:
    enabled: false
  slack:
    enabled: false
  email:
    enabled: false

kill_switch:
  file_path: PAPER_KILL_SWITCH
  check_interval_sec: 10
