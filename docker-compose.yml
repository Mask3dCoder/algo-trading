services:
  quantcore:
    build: .
    container_name: quantcore-live
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./quantcore:/app/quantcore
      - ./config:/app/config:ro
      - ./reports:/app/reports
      - ./data:/app/data
      - ./logs:/app/logs
      - ./scripts:/app/scripts:ro
    environment:
      - PYTHONUNBUFFERED=1
      - QUANTCORE_LIVE_CONFIG=config/live.yaml
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
      - ALPACA_BASE_URL=${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - QUANTCORE_ALERTING__SLACK__WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
