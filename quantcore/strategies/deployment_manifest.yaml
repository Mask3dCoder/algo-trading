# QuantCore Strategy Deployment Manifest
# ============================================================================
# Single source of truth for strategy deployment status, recommended parameters,
# risk limits, and monitoring thresholds.
# Use with: quantcore.deployment.load_manifest("strategies/deployment_manifest.yaml")

# Version of this manifest schema
manifest_version: 1

# ---------------------------------------------------------------------------
# Global defaults — applied to all strategies unless overridden
# ---------------------------------------------------------------------------
defaults:
  backtest:
    min_history_bars: 200       # minimum bars before strategy emits signals
    walk_fold_size: 50          # OOS test size for walk-forward validation
    embargo_pct: 0.02
  monitoring:
    eval_freq_days: 1           # daily performance evaluation
    alert_cooldown_min: 60      # don't re-alert within 60 min of same alert
    max_consecutive_losses: 5   # alert if N consecutive losing days
    max_dd_from_peak: -0.15     # alert if drawdown exceeds 15%
  risk:
    max_per_asset_weight: 0.40  # max 40% in any single asset
    max_leverage: 1.0

# ---------------------------------------------------------------------------
# Strategy definitions
# ---------------------------------------------------------------------------
strategies:

  # ==========================================================================
  # macro_risk_parity
  # ==========================================================================
  - id: macro_risk_parity
    name: "Risk Parity — Equal Risk Contribution"
    type: macro
    status: MONITOR                    # MONITOR = deploy with close observation
    confidence: HIGH                   # stable OOS performance, parameter-robust
    description: >
      Allocates capital so each asset contributes equally to portfolio risk.
      Vol-targets each asset individually and applies regime overlay to scale
      into low-vol regimes and out of high-vol regimes. Includes a portfolio-level
      vol regime filter that linearly scales positions when 20-bar vol exceeds
      vol_target * 0.40.

    # Recommended parameters from stress test sensitivity analysis
    recommended_params:
      vol_target: 0.10                 # annualized vol target
      lookback: 100                    # covariance estimation lookback
      rebalance_freq: 21               # monthly rebalance (freq=1 also valid)
      regime_overlay: true
      max_leverage: 1.0
      vol_regime_enabled: true
      vol_regime_threshold: 0.40
      vol_regime_lookback: 20
      min_vol_scale: 0.30

    # Performance metrics (synthetic data walk-forward)
    performance:
      oos_sharpe: +1.11                # out-of-sample Sharpe ratio
      regime_sharpe:
        HIGH_VOL:  +0.81
        LOW_VOL:   +3.07
        NORMAL:    +2.04
        TREND_UP:  +10.20
      max_drawdown_pct: N/A            # not measured separately
      parameter_sensitivity:
        most_sensitive: rebalance_freq
        stability: "Stable across vol_target (±60%), max_leverage (±60%), regime_overlay on/off"
        avoid: "rebalance_freq=30 (SR crashes to -0.02); use freq=1 or freq=21"

    # Risk limits (overrides defaults)
    risk:
      max_leverage: 1.0
      max_per_asset_weight: 0.40

    # Capacity limits
    capacity:
      estimated_ceiling: 500_000       # AUM ceiling before degradation
      limiting_factor: "Margin costs dominate at scale (>$500K)"
      ceiling_sharpe_ratio: +0.97      # estimated SR at ceiling

    # Live monitoring thresholds
    monitoring:
      regime_alerts:
        - name: high_vol
          condition: "20-bar portfolio vol > vol_target * 0.40"
          action: "Verify regime_scale < 1.0; check position sizes reduced proportionally"
        - name: correlation_regime
          condition: "Pairwise correlation > 0.70"
          action: "Risk parity diversifies across assets — high correlation reduces effectiveness; consider reducing leverage"
      drawdown_alerts:
        - level: -0.05                 # -5%
          action: notify
        - level: -0.10                 # -10%
          action: reduce_25
        - level: -0.15                 # -15%
          action: reduce_50
      vol_limits:
        max_daily_loss_pct: -0.03      # -3% daily loss triggers alert
        max_rolling_vol: 0.20          # annualized
        vol_spike_multiple: 2.5        # short/long vol ratio alert
      max_consecutive_losses: 5

    # Known risks and caveats
    known_risks:
      - "Synthetic data only — no real market data validation performed"
      - "Regime filter provides drawdown reduction but is SR-neutral (uniform scaling)"
      - "Margin costs dominate at scale above $500K — limits capacity"
      - "No options or cross-asset hedging implemented"

    # Phase A real-data validation results
    phase_a_real_data:
      date: "2026-04-28"
      verdict: "FAIL — Below MONITOR threshold (SR +0.128 vs required +0.50)"
      diagnostics: "Full period OOS SR +0.128 on 2018-2024 real data. 3 vol_target adjustments attempted (0.12→+0.115, 0.15→+0.125, 0.18→+0.110) — vol_target scales signal and noise proportionally, producing no net Sharpe improvement. Signal-to-noise ratio fundamentally limited (approx 0.11). Strategy not parameter-fixable."
      next_steps: "No further parameter tuning warranted. Monitor only. Consider fundamentally different signal generation approach if deployment is desired."

  # ==========================================================================
  # macro_cta_trend
  # ==========================================================================
  - id: macro_cta_trend
    name: "CTA Multi-Speed Trend Following"
    type: macro
    status: REJECTED                     # REJECTED — Phase A real-data: 2 showstoppers, no fix viable
    confidence: LOW                       # synthetic SR +1.79 was overfit; real OOS SR -0.147
    rejection_reason: >
      CATASTROPHIC FAILURE on real data (2018-2024). Full period OOS Sharpe -0.147
      (2 showstoppers: full and GFC). Diagnostics confirmed signal has 53.2% conditional
      win rate but extreme kurtosis (52.9) from trend-reversal losses. Conviction-based
      position scaling attempted but degraded previously-passing COVID regime (+0.991
      to +0.004). Requires fundamentally different approach — not fixable with position
      scaling alone.
    description: >
      Classic CTA approach combining signals from multiple timeframes (fast,
      medium, slow) using weighted averaging. Applies volatility targeting for
      position sizing. Includes dynamic weight shifting during high-vol regimes
      (reduces noisy fast-signal weight in favor of stable slow signals) and
      inverse-square position scaling.

    # Recommended parameters from stress test analysis
    recommended_params:
      fast_window: 20
      medium_window: 50
      slow_window: 200
      fast_weight: 0.2
      medium_weight: 0.3
      slow_weight: 0.5
      vol_target: 0.15                 # annualized vol target
      vol_lookback: 60
      rebalance_freq: 5
      vol_regime_enabled: true
      vol_regime_threshold: 0.30       # threshold = vol_target * 0.30
      vol_regime_lookback: 20
      min_vol_scale: 0.20

    # Performance metrics — synthetic (original) and real-data (Phase A)
    performance:
      oos_sharpe:
        synthetic: +1.79               # after vol regime fix (was +1.29)
        real_data: -0.147              # Phase A full period 2018-2024
      regime_sharpe:
        synthetic:
          HIGH_VOL:  +0.40
          LOW_VOL:   +1.66
          NORMAL:    +2.57
          TREND_UP:  +3.35
        real_data:
          Full_2018_2024:  -0.147     # SHOWSTOPPER
          GFC_2008:        -0.734     # SHOWSTOPPER
          Q4_Vol_2018:     +2.613     # PASS
          COVID_2020:      +0.991     # PASS
          Rate_Hikes_2022: +0.904     # PASS
          Bull_2023_2024:  +0.176     # FAIL
      max_drawdown_pct:
        synthetic: 0.061
        real_data: 0.145              # -14.5% on real data
      parameter_sensitivity:
        most_sensitive: medium_window
        stability: "All variants produce positive OOS SR on synthetic. Real-data negative."

    # Phase A real-data validation results
    phase_a_real_data:
      date: "2026-04-28"
      verdict: "FAIL — CATASTROPHIC FAILURE"
      diagnostics: "D1-D6 completed. Implementation clean, data clean, pipeline clean. Strategy structurally weak on real data — 80% zero-return bars, kurtosis 52.9, non-zero win rate 53.2%. Conviction and choppiness filters attempted but degraded COVID regime."
      next_steps: "Fundamentally different approach needed. Consider regime filter, adaptive sizing, or alternative strategy class."

    # Risk limits
    risk:
      max_leverage: 1.0
      vol_regime:
        weight_shift_max: 0.4          # max fast->slow weight shift during high vol
        min_scale: 0.20                # don't scale below 20% of position

    # Capacity limits
    capacity:
      estimated_ceiling: 1_000_000     # AUM ceiling
      limiting_factor: "Market impact costs dominate at scale"
      ceiling_sharpe_ratio: +0.31      # estimated engine SR at $1M (1x TC)

    # Live monitoring thresholds
    monitoring:
      regime_alerts:
        - name: high_vol
          condition: "20-bar portfolio vol > vol_target * 0.30"
          action: "Verify regime_scale < 1.0 and weight shift active; check slow signal dominance"
        - name: signal_divergence
          condition: "Fast signal direction differs from slow signal"
          action: "Normal during volatile chop — verify weight shift is protecting against fast-signal noise"
      drawdown_alerts:
        - level: -0.05
          action: notify
        - level: -0.08
          action: reduce_25
        - level: -0.12
          action: reduce_50
      vol_limits:
        max_daily_loss_pct: -0.04
        max_rolling_vol: 0.25
        vol_spike_multiple: 2.0
      max_consecutive_losses: 5
      trend_health:
        min_signal_cross_correlation: -0.10   # alert if signal-market corr below this
        max_beta_to_trend_benchmark: 0.50     # alert if beta to SMA crossover > 0.50

    # Known risks and caveats
    known_risks:
      - "Synthetic data only — no real market data validation performed"
      - "Signal cross-correlation at lag 0 (weak concurrent, not predictive)"
      - "Beta = 0.34 to SMA crossover benchmark — moderate trend exposure with high idiosyncratic component"
      - "Market impact costs degrade SR significantly above $1M"
      - "Weight shift may under-rotate during sustained chop (fast/medium both negative)"

# ---------------------------------------------------------------------------
# Cross-strategy portfolio limits
# ---------------------------------------------------------------------------
portfolio:
  max_total_leverage: 1.5
  max_correlation_between_strategies: 0.60     # upper bound on pairwise strategy correlation
  rebalance_freq_days: 21
  cash_reserve_pct: 0.10                        # 10% cash reserve at all times
