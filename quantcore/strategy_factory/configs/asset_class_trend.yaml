name: asset_class_trend
type: time_series
universe: cta
universe_tickers: null
description: >
  Asset-class trend following on 5 macro ETFs (CTA universe: DBC, GLD,
  IEF, SPY, TLT). Uses 12-month momentum signal (same as TSMOM).
  Long when trend > 0, short when < 0. Volatility-scaled targeting 15%
  annualized vol. FRED yield curve regime filter prevents trading during
  extreme tightening (inverted curve) regimes.
status: active

signal:
  formula: "momentum(12,1)"
  rank: null
  parameters: {}

rebalance: monthly
market_neutral: false
position_limit: 0.30
leverage_cap: 2.0

filters:
  min_volume: 0
  min_price: 1
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 5.0
  slippage_bps: 2.0
  max_participation: 0.05

regime_filter:
  enabled: true
  signal: yield_curve_regime
  threshold: -1.0
  inverse: false

warmup_bars: 260
risk_free_rate: 0.04