name: carry
type: time_series
universe: cta
universe_tickers: null
description: >
  Carry strategy — long assets with positive carry (yield proxy),
  short negative carry. Uses annualized short-term return stability
  as carry approximation for ETFs.
status: active

signal:
  formula: "carry(21)"
  rank: null
  parameters: {}

rebalance: monthly
market_neutral: false
position_limit: 0.20
leverage_cap: 2.0

filters:
  min_volume: 0
  min_price: 0
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 5.0
  slippage_bps: 2.0
  max_participation: 0.05

regime_filter:
  enabled: true
  signal: yield_curve_regime
  threshold: 0.0
  inverse: false

warmup_bars: 30
risk_free_rate: 0.04
