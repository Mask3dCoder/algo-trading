name: cross_sectional_momentum
type: cross_sectional
universe: expanded_15
universe_tickers: null
description: >
  Cross-sectional momentum: rank assets by 12-month return (1-month skip),
  long top decile, short bottom decile. Market-neutral. FRED yield curve
  regime filter reduces exposure during inverted curve regimes.
status: active

signal:
  formula: "momentum(12,1)"
  rank: "decile"
  parameters: {}

rebalance: monthly
market_neutral: true
position_limit: 0.15
leverage_cap: 2.0

filters:
  min_volume: 0
  min_price: 1
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 5.0
  slippage_bps: 2.0
  max_participation: 0.05

regime_filter:
  enabled: true
  signal: yield_curve_regime
  threshold: 0.0
  inverse: false

warmup_bars: 260
risk_free_rate: 0.04