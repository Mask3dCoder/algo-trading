name: delta_neutral
type: options
universe: options_underlying
universe_tickers:
  - SPY
  - QQQ
description: >
  Delta-neutral volatility selling strategy. Sells overpriced options
  (IV > RV) when IV rank exceeds entry threshold, then delta-hedges
  with the underlying. Gamma scalping via daily delta rebalancing.
  Full P&L decomposition into delta, gamma, vega, theta components.
status: ready

signal:
  formula: "iv_rank(252)"
  rank: null
  parameters:
    ivr_entry: 50
    ivr_exit: 25

rebalance: daily
market_neutral: true
position_limit: 0.20
leverage_cap: 1.0

filters:
  min_volume: 100
  min_price: 50
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 10.0
  slippage_bps: 5.0
  max_participation: 0.02

regime_filter:
  enabled: false
  signal: null
  threshold: 0.0
  inverse: false

strategy_params:
  dte_min: 30
  dte_max: 60
  delta_target: 0.3
  hedge_freq: 1
  gamma_scalp_threshold: 0.01
  max_positions: 5

warmup_bars: 252
risk_free_rate: 0.04
