name: etf_arbitrage
type: arbitrage
universe: ETF_EXPANDED
universe_tickers: null
description: >
  ETF arbitrage — exploit NAV discount/premium between ETF and
  underlying basket. Requires real-time NAV data and authorized
  participant flow.
status: requires_data
requires: >
  ETF constituent weights and basket composition data from issuer or API.
  Real-time intraday NAV (iNAV) feed. Authorized participant
  creation/redemption flow for execution. Without these, the NAV
  discount/premium signal cannot be computed at the required frequency.

signal:
  formula: "zscore(20)"
  rank: "zscore_long_short(2.0)"
  parameters: {}

rebalance: continuous
market_neutral: true
position_limit: 0.10
leverage_cap: 3.0

filters:
  min_volume: 1000000
  min_price: 10
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 2.0
  slippage_bps: 1.0
  max_participation: 0.10

regime_filter:
  enabled: false
  signal: financial_conditions
  threshold: 0.0
  inverse: false

warmup_bars: 30
risk_free_rate: 0.04
