name: index_arbitrage
type: arbitrage
universe: expanded_15
universe_tickers: null
description: >
  Index arbitrage — exploit futures-spot basis. Requires futures
  data and real-time index calculation.
status: requires_data
requires: >
  Real-time index futures prices (e.g., ES, NQ) and spot index calculation.
  Cost-of-carry model inputs (dividend yields, short-term rates).
  Requires intraday data (minute-level or tick) — daily OHLCV is
  insufficient for index arbitrage which operates on sub-minute
  futures-spot basis deviations.

signal:
  formula: "zscore(5)"
  rank: "zscore_long_short(1.5)"
  parameters: {}

rebalance: continuous
market_neutral: true
position_limit: 0.15
leverage_cap: 3.0

filters:
  min_volume: 0
  min_price: 0
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 2.0
  slippage_bps: 1.0
  max_participation: 0.10

regime_filter:
  enabled: false
  signal: yield_curve_regime
  threshold: 0.0
  inverse: false

warmup_bars: 10
risk_free_rate: 0.04
