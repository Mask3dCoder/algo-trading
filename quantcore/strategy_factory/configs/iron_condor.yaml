name: iron_condor
type: options
universe: options_underlying
universe_tickers:
  - SPY
  - QQQ
  - IWM
description: >
  Iron condor: sell 16-delta OTM put spread + OTM call spread when
  IV rank is elevated (above 40). 30-45 DTE entry window. Adjusts
  threatened wing when price approaches short strike within 3%.
  Exits at 50% profit target, 200% max loss, or DTE < 7.
status: active

signal:
  formula: "iv_rank(252)"
  rank: null
  parameters:
    ivr_entry: 40
    ivr_exit: 20

rebalance: daily
market_neutral: true
position_limit: 0.20
leverage_cap: 1.0

filters:
  min_volume: 500
  min_price: 50
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 10.0
  slippage_bps: 5.0
  max_participation: 0.02

regime_filter:
  enabled: false
  signal: null
  threshold: 0.0
  inverse: false

strategy_params:
  delta_short: 16
  delta_wing_width: 10
  dte_entry_min: 30
  dte_entry_max: 45
  profit_target_pct: 50
  max_loss_pct: 200
  adjustment_threshold: 3

warmup_bars: 252
risk_free_rate: 0.04
