name: market_making
type: hft
universe: SP500
universe_tickers: null
description: >
  Market making — provide two-sided liquidity, capture bid-ask spread.
  Requires Level 2 order book data and co-located execution.
status: requires_infra
requires: >
  Level 2 order book data (full depth) for quote generation. Co-located
  execution venue with sub-millisecond latency. Real-time inventory
  management and adverse selection model. HFT infrastructure with
  direct market access (DMA) — impossible with daily OHLCV data alone.

signal:
  formula: "zscore(5)"
  rank: "zscore_long_short(0.5)"
  parameters: {}

rebalance: continuous
market_neutral: true
position_limit: 0.02
leverage_cap: 5.0

filters:
  min_volume: 5000000
  min_price: 10
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 1.0
  slippage_bps: 0.5
  max_participation: 0.02

regime_filter:
  enabled: false
  signal: financial_conditions
  threshold: 0.0
  inverse: false

warmup_bars: 10
risk_free_rate: 0.04
