name: mean_reversion
type: mean_reversion
universe: expanded_15
universe_tickers: null
description: >
  Mean reversion using Bollinger Band z-score on 20-day window, 2 std dev.
  Long when z < -2.0 (oversold), short when z > 2.0 (overbought).
  Bollinger Band width filter ensures only trades when bands are wide
  enough (high vol regime, better for reversions). FRED economic momentum
  filter disables mean reversion during strong trending regimes (inverse
  logic: only trade when economic_momentum is weak/negative).
status: active

signal:
  formula: "bollinger_zscore(20,2.0)"
  rank: "zscore_long_short(1.5)"
  parameters:
    bb_width_min: 0.02

rebalance: daily
market_neutral: true
position_limit: 0.10
leverage_cap: 2.0

filters:
  min_volume: 0
  min_price: 1
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 5.0
  slippage_bps: 2.0
  max_participation: 0.05

regime_filter:
  enabled: true
  signal: economic_momentum
  threshold: 0.0
  inverse: true

warmup_bars: 30
risk_free_rate: 0.04