name: merger_arbitrage
type: event_driven
universe: SP500
universe_tickers: null
description: >
  Merger arbitrage — capture spread between target price and deal
  price after announced M&A. Requires deal database and regulatory
  approval tracking.
status: requires_data
requires: >
  Real-time M&A deal database feed (announced deals, deal terms,
  expected close dates, deal spread). Regulatory approval status
  tracker. Deal break probability model. Event-driven strategy
  requiring fundamental event data beyond daily OHLCV prices.

signal:
  formula: "carry(21)"
  rank: "long_only_top"
  parameters: {}

rebalance: daily
market_neutral: false
position_limit: 0.05
leverage_cap: 1.5

filters:
  min_volume: 1000000
  min_price: 5
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 5.0
  slippage_bps: 3.0
  max_participation: 0.03

regime_filter:
  enabled: false
  signal: financial_conditions
  threshold: 0.0
  inverse: false

warmup_bars: 30
risk_free_rate: 0.04
