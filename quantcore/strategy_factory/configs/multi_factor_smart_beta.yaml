name: multi_factor_smart_beta
type: factor
universe: expanded_15
universe_tickers: null
description: >
  Multi-factor smart beta combining momentum (12-month), value (HML
  factor loading), and quality (RMW factor loading) signals in an
  equal-weighted composite. Cross-sectional tercile ranking on the
  blended factor score. FRED yield curve regime filter reduces equity
  exposure during inverted curve regimes (tightening cycles hurt most
  factor strategies simultaneously).
status: active

signal:
  formula: "momentum(12,1)"
  rank: "tercile"
  parameters:
    composite_factors:
      - "factor_loading(HML)"
      - "factor_loading(RMW)"

rebalance: monthly
market_neutral: true
position_limit: 0.10
leverage_cap: 2.0

filters:
  min_volume: 0
  min_price: 1
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 5.0
  slippage_bps: 2.0
  max_participation: 0.05

regime_filter:
  enabled: true
  signal: yield_curve_regime
  threshold: 0.0
  inverse: false

warmup_bars: 260
risk_free_rate: 0.04