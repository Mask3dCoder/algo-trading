name: opening_gap_fade
type: equity
universe: sp500_subset
universe_tickers: null
description: >
  Intraday mean-reversion on overnight gaps. Stocks that gap significantly
  at the open tend to partially revert during the first 30-60 minutes as
  overnight orders are absorbed and price discovery normalises. Enters at
  09:30 ET, exits by 10:00 ET via time limit, retracement target, or stop.
status: active

signal:
  formula: "gap_fade"
  rank: null
  parameters:
    gap_threshold_pct: 2.0
    exit_minutes: 30
    retracement_target: 0.50
    max_positions: 10
    max_position_pct: 0.05
    min_adv_dollars: 10000000
    min_price: 10.0
    stop_loss_pct: 1.5

rebalance: intraday
market_neutral: false
position_limit: 0.05
leverage_cap: 1.0

filters:
  min_volume: 0
  min_price: 10.0
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 5.0
  slippage_bps: 5.0
  max_participation: 0.05

regime_filter:
  enabled: false
  signal: null
  threshold: 0.0
  inverse: false

warmup_bars: 2
risk_free_rate: 0.04
data_source: intraday
bar_size: 5min
