name: pairs_trading
type: pairs
universe: expanded_15
universe_tickers: null
description: >
  Pairs trading via cointegration spread. Uses rolling 60-day OLS
  hedge ratio estimation on cointegrated pairs. Pairs source:
  data/pairs_found.csv (pre-computed cointegrated pairs from the
  pairs finder). FRED financial conditions filter disables trading
  during high-stress regimes (e.g., COVID, GFC) where cointegration
  relationships break down.
status: active

signal:
  formula: "cointegration_spread"
  rank: null
  parameters:
    pairs_file: "data/pairs_found.csv"
    hedge_window: 60

rebalance: daily
market_neutral: true
position_limit: 0.15
leverage_cap: 2.0

filters:
  min_volume: 0
  min_price: 1
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 5.0
  slippage_bps: 2.0
  max_participation: 0.05

regime_filter:
  enabled: true
  signal: financial_conditions
  threshold: 0.0
  inverse: false

warmup_bars: 80
risk_free_rate: 0.04