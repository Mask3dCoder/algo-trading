name: quality_factor
type: factor
universe: expanded_15
universe_tickers: null
description: >
  Quality factor using composite factor loading on RMW (Robust Minus
  Weak profitability) and CMA (Conservative Minus Aggressive investment)
  from Fama-French 5-factor model. Long top quintile (high quality),
  short bottom quintile (low quality). Falls back to relative_strength(60)
  if factor data unavailable. FRED financial conditions filter avoids
  quality-factor drawdowns during liquidity crises.
status: active

signal:
  formula: "factor_loading(RMW)"
  rank: "quintile"
  parameters:
    secondary_factor: "CMA"
    regression_window: 60

rebalance: monthly
market_neutral: true
position_limit: 0.10
leverage_cap: 2.0

filters:
  min_volume: 0
  min_price: 1
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 5.0
  slippage_bps: 2.0
  max_participation: 0.05

regime_filter:
  enabled: true
  signal: financial_conditions
  threshold: 0.0
  inverse: false

warmup_bars: 260
risk_free_rate: 0.04