name: spread_capture
type: hft
universe: expanded_15
universe_tickers: null
description: >
  Spread capture — implemented at the execution layer, not alpha layer.
  The SmartExecutionRouter (quantcore/execution/) already handles spread
  capture via TWAP/VWAP/POV algos that minimize market impact and capture
  bid-ask spread during order execution. This is an execution-quality
  concern, not a standalone alpha signal. No config needed.
status: requires_infra
requires: >
  Implemented at execution level via SmartExecutionRouter. The TWAP/VWAP/POV
  algos in quantcore/execution/ already handle spread capture during order
  execution. No separate alpha-layer strategy is required.

signal:
  formula: "zscore(5)"
  rank: null
  parameters: {}

rebalance: continuous
market_neutral: true
position_limit: 0.05
leverage_cap: 2.0

filters:
  min_volume: 1000000
  min_price: 10
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 1.0
  slippage_bps: 0.5
  max_participation: 0.10

regime_filter:
  enabled: false
  signal: financial_conditions
  threshold: 0.0
  inverse: false

warmup_bars: 30
risk_free_rate: 0.04