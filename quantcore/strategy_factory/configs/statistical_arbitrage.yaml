name: statistical_arbitrage
type: cross_sectional
universe: ETF_EXPANDED
universe_tickers: null
description: >
  Statistical arbitrage using cointegration-spread cross-sectional ranking.
  Uses rolling 252-day cointegration re-estimation monthly across a
  broad 57-asset ETF universe. Pairs are dynamically re-estimated
  each month (vs. static pairs in pairs_trading). FRED financial
  conditions filter avoids trading during high-stress regimes.
status: active

signal:
  formula: "cointegration_spread"
  rank: "zscore_long_short(1.5)"
  parameters:
    reestimate_window: 252
    reestimate_freq: 21

rebalance: monthly
market_neutral: true
position_limit: 0.08
leverage_cap: 2.0

filters:
  min_volume: 100000
  min_price: 5
  max_price: 999999
  exclude_symbols: ["VXX", "UUP", "FXE"]
  include_symbols: null

execution:
  tc_bps: 5.0
  slippage_bps: 2.0
  max_participation: 0.05

regime_filter:
  enabled: true
  signal: financial_conditions
  threshold: 0.0
  inverse: false

warmup_bars: 260
risk_free_rate: 0.04