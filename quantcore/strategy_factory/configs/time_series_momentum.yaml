name: time_series_momentum
type: time_series
universe: expanded_15
universe_tickers: null
description: >
  Time-series momentum (TSMOM) on 12-month return with 1-month skip.
  Long when 12-month return > 0, short when < 0. Volatility-scaled
  targeting 15% annualized vol via position sizing. Universe uses
  expanded_15 (blue-chip ETF proxy for BLUECHIP 100). FRED regime
  filter avoids trading during extreme risk-off regimes.
status: active

signal:
  formula: "momentum(12,1)"
  rank: null
  parameters:
    vol_target: 0.15

rebalance: monthly
market_neutral: false
position_limit: 0.25
leverage_cap: 2.0

filters:
  min_volume: 0
  min_price: 1
  max_price: 999999
  exclude_symbols: []
  include_symbols: null

execution:
  tc_bps: 5.0
  slippage_bps: 2.0
  max_participation: 0.05

regime_filter:
  enabled: true
  signal: yield_curve_regime
  threshold: -0.5
  inverse: false

warmup_bars: 260
risk_free_rate: 0.04