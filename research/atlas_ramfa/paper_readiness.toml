# Atlas RAMFA paper-readiness snapshot (RESEARCH ONLY)
# Do not import this file into config/paper.yaml or config/live.yaml until all
# validation gates are passed and model-risk review is approved.

[strategy]
name = "atlas_ramfa"
status = "RESEARCH"
strategy_type = "EQUITY"
max_position_notional = 1000000.0
max_leverage = 1.5
risk_budget_pct = 0.02

[params]
rebalance_freq = 1
lookback_days = 252
skip_days = 21
vol_lookback = 63
n_long = 8
n_short = 8
min_liquidity_score = 0.0
max_gross_exposure = 1.5
min_net_exposure = -0.25
max_net_exposure = 0.5
single_name_max_pct = 0.02
use_regime_filter = true
min_regime_score = 55.0
regime_exposure_multiplier = true
max_regime_multiplier = 1.0
min_regime_multiplier = 0.15

[validation]
activation_gate = "not_met_pending_point_in_time_walk_forward_transaction_cost_model_risk_review"
paper_trading_days_required = 60
required_oos_sharpe_ci_low = 0.3
required_max_drawdown_pct = 10.0
